<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a Especialidades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fff9c4; color: #222; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { text-align: center; color: #b62a2a; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    .box, .form-card { background: #fffef0; padding: 25px; border-radius: 10px; border: 3px solid #b62a2a; box-shadow: 0 2px 8px rgba(0,0,0,.08); animation: bordeAnimado 2s ease-in-out infinite; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 9px; border: 1px solid #e6d96a; border-radius: 5px; font-size: 14px; background: #fffde7; margin: 8px 0; }
    .btn, button { background: #b62a2a; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
    .btn:hover, button:hover { background: #8f2020; }
    .msg { padding: 12px; border-radius: 6px; margin: 15px 0; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .back { display: block; text-align: center; margin-top: 20px; color: #1a5276; }
    @keyframes bordeAnimado {
      0%, 100% { border-color: #b62a2a; box-shadow: 0 2px 8px rgba(114, 28, 36, .12); }
      50% { border-color: #e6d96a; box-shadow: 0 2px 14px rgba(230, 217, 106, .45); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inscripción a Especialidades</h1>
    <p class="subtitle">Instituto Nuestra Señora de la Merced</p>

    <!-- Bloque 1: pedir login -->
    <div id="loginBox" class="box" style="display:block;">
      <p>Para inscribirte, primero ingresá con tu cuenta institucional.</p>
      <button onclick="loginGoogle()">Ingresar con Google</button>
    </div>

    <!-- Bloque 2: acceso denegado -->
    <div id="deniedBox" class="box" style="display:none;">
      <p style="color:#b62a2a;"><strong>Acceso denegado.</strong></p>
      <p>Tu correo no es institucional. Usá una cuenta que termine en <strong>@institutolamerced.edu.ar</strong>.</p>
    </div>

    <!-- Bloque 3: el formulario -->
    <div id="formBox" class="form-card" style="display:none;">
      <form id="formEspecialidad">
        <label>Nombre y apellido</label>
        <input type="text" id="nombre" required>

        <label>¿De qué tercer año proviene?</label>
        <select id="tercerAno" required>
          <option value="">Seleccioná...</option>
          <option value="A">3° A</option>
          <option value="B">3° B</option>
        </select>

        <label>Especialidad</label>
        <select id="especialidad" required>
          <option value="">Seleccioná...</option>
          <option value="Informática">Informática</option>
          <option value="Administración">Administración</option>
          <option value="Otra">Otra</option>
        </select>

        <label>Comentarios</label>
        <textarea id="comentarios" rows="3"></textarea>

        <button type="submit">Enviar inscripción</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCTqB7wWOZv-p1sNvfNtEZASw3K4VWmZo",
      authDomain: "inscripciones-merced-4fc14.firebaseapp.com",
      projectId: "inscripciones-merced-4fc14",
      storageBucket: "inscripciones-merced-4fc14.firebasestorage.app",
      messagingSenderId: "588336598798",
      appId: "1:588336598798:web:4e745d090b9335e907115f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBox = document.getElementById('loginBox');
    const deniedBox = document.getElementById('deniedBox');
    const formBox = document.getElementById('formBox');

    function esCorreoInstitucional(correo) {
      return correo.endsWith('@institutolamerced.edu.ar');
    }

    window.loginGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => {
        console.error(err);
        alert('Error al iniciar sesión: ' + err.message);
      });
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (esCorreoInstitucional(user.email)) {
          loginBox.style.display = 'none';
          deniedBox.style.display = 'none';
          formBox.style.display = 'block';
        } else {
          loginBox.style.display = 'none';
          deniedBox.style.display = 'block';
          formBox.style.display = 'none';
        }
      } else {
        loginBox.style.display = 'block';
        deniedBox.style.display = 'none';
        formBox.style.display = 'none';
      }
    });

    document.getElementById('formEspecialidad').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, 'especialidades'), {
          nombre: document.getElementById('nombre').value,
          tercerAno: document.getElementById('tercerAno').value,
          especialidad: document.getElementById('especialidad').value,
          comentarios: document.getElementById('comentarios').value,
          correo: auth.currentUser ? auth.currentUser.email : '',
          fecha: serverTimestamp()
        });
        alert('¡Inscripción registrada!');
        e.target.reset();
      } catch (err) {
        console.error(err);
        alert('Error al guardar: ' + err.message);
      }
    });
  </script>
</body>
</html>
