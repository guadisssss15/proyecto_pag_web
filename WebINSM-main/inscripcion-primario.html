<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción - Nivel Primario</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fff9c4; color: #222; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { text-align: center; color: #b62a2a; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    .form-card { background: #fffef0; padding: 25px; border-radius: 10px; border: 3px solid #b62a2a; box-shadow: 0 2px 8px rgba(0,0,0,.08); animation: bordeAnimado 2s ease-in-out infinite; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #e6d96a; border-radius: 5px; font-size: 14px; background: #fffde7; }
    .adult-block { border: 1px solid #e6d96a; border-radius: 8px; padding: 15px; margin: 15px 0; background: #fffde7; }
    .adult-block h3 { font-size: 15px; margin-bottom: 8px; color: #b62a2a; }
    .btn { background: #b62a2a; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
    .btn:hover { background: #b62a2a; }
    .msg { padding: 12px; border-radius: 6px; margin: 15px 0; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .back { display: block; text-align: center; margin-top: 20px; color: #1a5276; }
    @keyframes bordeAnimado {
      0%, 100% { border-color: #b62a2a; box-shadow: 0 2px 8px rgba(114, 28, 36, .12); }
      50% { border-color: #e6d96a; box-shadow: 0 2px 14px rgba(230, 217, 106, .45); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inscripción — Nivel Primario</h1>
    <p class="subtitle">Colegio Cervellón · Instituto La Merced</p>

    <div class="form-card">
      <form id="formPrimario">
        <label>Nombre y Apellido *</label>
        <input type="text" id="nombre" required>

        <label>DNI</label>
        <input type="text" id="dni">

        <label>Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento">

        <label>Domicilio completo</label>
        <input type="text" id="domicilio">

        <label>Ciudad</label>
        <input type="text" id="ciudad">

        <label>Grado al que se inscribe</label>
        <select id="grado">
          <option value="1">Primer Grado</option>
          <option value="2">Segundo Grado</option>
          <option value="3">Tercer Grado</option>
          <option value="4">Cuarto Grado</option>
          <option value="5">Quinto Grado</option>
          <option value="6">Sexto Grado</option>
        </select>

        <label>¿Cursa actualmente en otra institución?</label>
        <select id="otraInstitucion">
          <option value="no">No</option>
          <option value="si">Sí</option>
        </select>

        <label>Turno al que desea inscribirse</label>
        <select id="turno">
          <option value="manana">Mañana</option>
          <option value="tarde">Tarde</option>
        </select>

        <div class="adult-block">
          <h3>Adulto Responsable 1</h3>
          <label>Nombre y Apellido</label><input type="text" id="a1-nombre">
          <label>DNI</label><input type="text" id="a1-dni">
          <label>Parentesco</label><input type="text" id="a1-parentesco">
          <label>Teléfono (celular o WhatsApp)</label><input type="text" id="a1-telefono">
          <label>Correo electrónico</label><input type="email" id="a1-email">
          <label>Ocupación / Lugar de trabajo</label><input type="text" id="a1-ocupacion">
        </div>

        <div class="adult-block">
          <h3>Adulto Responsable 2</h3>
          <label>Nombre y Apellido</label><input type="text" id="a2-nombre">
          <label>DNI</label><input type="text" id="a2-dni">
          <label>Parentesco</label><input type="text" id="a2-parentesco">
          <label>Teléfono (celular o WhatsApp)</label><input type="text" id="a2-telefono">
          <label>Correo electrónico</label><input type="email" id="a2-email">
          <label>Ocupación / Lugar de trabajo</label><input type="text" id="a2-ocupacion">
        </div>

        <button type="submit" class="btn">Enviar inscripción</button>
      </form>

      <div id="msg" class="msg"></div>
      <a href="NivelPrimario.html" class="back">← Volver al inicio</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCTqB7wWOZv-p1sNvfNtEZASw3K4VWmZo",
      authDomain: "inscripciones-merced-4fc14.firebaseapp.com",
      projectId: "inscripciones-merced-4fc14",
      storageBucket: "inscripciones-merced-4fc14.firebasestorage.app",
      messagingSenderId: "588336598798",
      appId: "1:588336598798:web:4e745d090b9335e907115f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const msgBox = document.getElementById('msg');

    document.getElementById('formPrimario').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, 'primario'), {
          nivel: 'primario',
          nombre: document.getElementById('nombre').value,
          dni: document.getElementById('dni').value,
          fechaNacimiento: document.getElementById('fechaNacimiento').value,
          domicilio: document.getElementById('domicilio').value,
          ciudad: document.getElementById('ciudad').value,
          grado: document.getElementById('grado').value,
          otraInstitucion: document.getElementById('otraInstitucion').value,
          turno: document.getElementById('turno').value,
          adultos: [
            {
              nombre: document.getElementById('a1-nombre').value,
              dni: document.getElementById('a1-dni').value,
              parentesco: document.getElementById('a1-parentesco').value,
              telefono: document.getElementById('a1-telefono').value,
              email: document.getElementById('a1-email').value,
              ocupacion: document.getElementById('a1-ocupacion').value
            },
            {
              nombre: document.getElementById('a2-nombre').value,
              dni: document.getElementById('a2-dni').value,
              parentesco: document.getElementById('a2-parentesco').value,
              telefono: document.getElementById('a2-telefono').value,
              email: document.getElementById('a2-email').value,
              ocupacion: document.getElementById('a2-ocupacion').value
            }
          ],
          fecha: serverTimestamp()
        });
        msgBox.className = 'msg ok';
        msgBox.textContent = '✅ ¡Inscripción enviada con éxito!';
        document.getElementById('formPrimario').reset();
      } catch (err) {
        console.error(err);
        msgBox.className = 'msg err';
        msgBox.textContent = '❌ Hubo un error al enviar. Revisá tu conexión e intentá de nuevo.';
      }
    });
  </script>
</body>
</html>
