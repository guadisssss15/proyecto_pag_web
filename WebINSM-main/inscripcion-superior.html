<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción - Nivel Superior</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    h1 { text-align: center; color: #1a5276; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    .form-card { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .btn { background: #1a5276; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
    .btn:hover { background: #154360; }
    .msg { padding: 12px; border-radius: 6px; margin: 15px 0; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .back { display: block; text-align: center; margin-top: 20px; color: #1a5276; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Inscripción — Nivel Superior</h1>
    <p class="subtitle">Colegio Cervellón · Instituto La Merced</p>

    <div class="form-card">
      <form id="formSuperior">
        <label>Nombre completo del/la estudiante a inscribir *</label>
        <input type="text" id="nombre" required>

        <label>DNI del/la estudiante</label>
        <input type="text" id="dni">

        <label>Domicilio del/la estudiante</label>
        <input type="text" id="domicilio">

        <label>Teléfono de referencia 1</label>
        <input type="text" id="telefono1">

        <label>Teléfono de referencia 2 (indicar a quién pertenece) *</label>
        <input type="text" id="telefono2" required>

        <label>Correo electrónico</label>
        <input type="email" id="email">

        <label>Confirmación de correo electrónico</label>
        <input type="email" id="email2">

        <label>Institución en donde terminó el secundario *</label>
        <input type="text" id="institucion" required>

        <label>Año de finalización del secundario</label>
        <input type="text" id="anioFinalizacion">

        <label>¿Adeuda materias? *</label>
        <select id="adeudaMaterias">
          <option value="no">No</option>
          <option value="si">Sí</option>
        </select>

        <button type="submit" class="btn">Enviar inscripción</button>
      </form>

      <div id="msg" class="msg"></div>
      <a href="index.html" class="back">← Volver al inicio</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCTqB7wWOZv-p1sNvfNtEZASw3K4VWmZo",
      authDomain: "inscripciones-merced-4fc14.firebaseapp.com",
      projectId: "inscripciones-merced-4fc14",
      storageBucket: "inscripciones-merced-4fc14.firebasestorage.app",
      messagingSenderId: "588336598798",
      appId: "1:588336598798:web:4e745d090b9335e907115f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const msgBox = document.getElementById('msg');

    document.getElementById('formSuperior').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const email2 = document.getElementById('email2').value;


      if (email !== email2) {
        msgBox.className = 'msg err';
        msgBox.textContent = '❌ Los correos electrónicos no coinciden.';
        return;
      }

      try {
        await addDoc(collection(db, 'inscripciones'), {
          nivel: 'superior',
          nombre: document.getElementById('nombre').value,
          dni: document.getElementById('dni').value,
          domicilio: document.getElementById('domicilio').value,
          telefono1: document.getElementById('telefono1').value,
          telefono2: document.getElementById('telefono2').value,
          email: email,
          institucion: document.getElementById('institucion').value,
          anioFinalizacion: document.getElementById('anioFinalizacion').value,
          adeudaMaterias: document.getElementById('adeudaMaterias').value,
          fecha: serverTimestamp()
        });
        msgBox.className = 'msg ok';
        msgBox.textContent = '✅ ¡Inscripción enviada con éxito!';
        document.getElementById('formSuperior').reset();
      } catch (err) {
        console.error(err);
        msgBox.className = 'msg err';
        msgBox.textContent = '❌ Hubo un error al enviar. Revisá tu conexión e intentá de nuevo.';
      }
    });
  </script>
</body>
</html>
